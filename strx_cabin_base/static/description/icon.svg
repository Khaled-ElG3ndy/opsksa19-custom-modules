<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 22 225 225" width="256" height="256" role="img" aria-label="Cabin Control">
  <!-- The artwork is unchanged; only the viewBox that frames it. The drawing
       occupies x 50-235, y 40-229 in its own coordinates, which left it filling
       72% of a 0 0 256 256 canvas and sitting off to the right. This window is
       centred on the drawing and sized so it fills 84% of the square, the same
       proportion Odoo's own app icons use. -->
  <ellipse cx="128" cy="206" rx="78" ry="13" fill="#714B67" opacity="0.13"/>
  <g transform="translate(0,0) translate(128,128) scale(1.0) translate(-128,-128)">
    <path d="M128,40 L200,82 L128,124 L56,82 Z" fill="#B492AC"/>
    <path d="M56,82 L128,124 L128,130 L56,88 Z" fill="#5A3D52"/>
    <path d="M128,124 L200,82 L200,88 L128,130 Z" fill="#7A5471"/>
    <path d="M56,88 L128,130 L128,202 L56,160 Z" fill="#5A3D52"/>
    <path d="M128,130 L200,88 L200,160 L128,202 Z" fill="#7A5471"/>
    <path d="M143.8,134.8 L172.6,118 L172.6,170 L143.8,186.8 Z" fill="#F06050"/>
    <path d="M70.4,118.4 L100.6,136 L100.6,166 L70.4,148.4 Z" fill="#FFD8A8"/>
    <circle cx="150" cy="156" r="4" fill="#7A5471" opacity="0.75"/>
  </g>
  <circle cx="198" cy="192" r="37" fill="#FFFFFF"/>
  <circle cx="198" cy="192" r="34" fill="#00A09D"/>
  <g transform="translate(2,2)" stroke="#FFFFFF" fill="none" stroke-width="5.5" stroke-linecap="round">
    <circle cx="187" cy="181" r="8"/>
    <path d="M193.5,187.5 L207,201"/>
    <path d="M202.5,196.5 L207.5,191.5"/>
  </g>
</svg>
