<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
    Make Arabic text render in Noto Naskh Arabic instead of DejaVu Sans.

    Why this is needed: wkhtmltopdf picks the font for a missing glyph through
    fontconfig, not through the CSS font stack, and it ignores @font-face
    unicode-range. Without this rule every Arabic glyph in every Odoo report on
    this host falls back to DejaVu Sans, including mixed-script fields that CSS
    cannot target.

    Install on the report-rendering host:
        cp 60-ops-arabic.conf /etc/fonts/conf.d/
        fc-cache -f
    Requires the fonts-noto-core package, or copy the two .ttf files from
    ../src/fonts/ into /usr/share/fonts/truetype/noto/ first.
-->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Naskh Arabic</string></edit>
  </match>
</fontconfig>
